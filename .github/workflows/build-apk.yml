name: 构建Kivy机器人APK
on:
  push:
    branches: [ main ]
  workflow_dispatch: # 支持手动点击触发打包

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取源码
        uses: actions/checkout@v4

      - name: 设置Python3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 系统依赖
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: 安装Python依赖
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install buildozer kivy

      - name: 编译APK
        run: |
          buildozer -v android debug

      - name: 上传APK成品
        uses: actions/upload-artifact@v4
        with:
          name: robot-apk
          path: bin/*.apk

