name: 构建Kivy机器人APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: 拉取源码
        uses: actions/checkout@v4

      - name: 设置Python3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 缓存Buildozer NDK/SDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
          key: buildozer-cache-${{ hashFiles('buildozer.spec') }}

      - name: 安装系统依赖
        run: |
          sudo apt update -y
          sudo apt install -y --fix-missing git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: 升级pip，安装python包
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install buildozer kivy

      - name: 预接受Android SDK许可证
        run: |
          export ANDROID_SDK_ROOT=$HOME/.buildozer/android/platform/android-sdk
          yes | $ANDROID_SDK_ROOT/tools/bin/sdkmanager --licenses

      - name: Buildozer编译APK
        run: |
          buildozer -v android debug

      - name: 上传APK成品
        uses: actions/upload-artifact@v4
        with:
          name: robot-apk
          path: bin/*.apk
